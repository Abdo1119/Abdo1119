<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Abdallah Hosni — AI Engineer. LLM, RAG and Graph RAG. Production-focused AI systems.">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="55%" stop-color="#0B111C"/>
      <stop offset="100%" stop-color="#0D1422"/>
    </linearGradient>
    <radialGradient id="emberRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E23636" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#E23636" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E23636" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E23636"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8FA6CC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="330" fill="url(#base)"/>
  <rect width="1280" height="330" fill="url(#grid)"/>
  <ellipse cx="210" cy="140" rx="430" ry="265" fill="url(#emberRed)"/>
  <ellipse cx="1080" cy="195" rx="450" ry="275" fill="url(#coreCyan)"/>

  <g stroke="#38BDF8" stroke-opacity="0.42" stroke-width="1.6" fill="none" stroke-linecap="square">
    <path d="M34 66 V34 H66"/>
    <path d="M1214 34 H1246 V66"/>
    <path d="M34 264 V296 H66"/>
    <path d="M1214 296 H1246 V264"/>
  </g>
  <g stroke="#E23636" stroke-opacity="0.30" stroke-width="1.4" fill="none" stroke-linecap="square">
    <path d="M34 96 V78"/>
    <path d="M1246 96 V78"/>
  </g>

  <text x="640" y="118" text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="7.5" fill="#5FD0F5" fill-opacity="0.92">AI ENGINEER</text>

  <text x="640" y="192" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="5" fill="#F2F6FC">ABDALLAH HOSNI</text>

  <rect x="470" y="214" width="340" height="2.5" rx="1.25" fill="url(#accentRule)"/>

  <text x="640" y="252" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16.5" letter-spacing="2.6" fill="#A9BAD4">LLM &#183; RAG &#183; GRAPH RAG &#183; NLP &#183; COMPUTER VISION</text>

  <text x="640" y="284" text-anchor="middle" font-family="'Consolas','SF Mono','Roboto Mono',monospace" font-size="13.5" letter-spacing="3.2" fill="#6E829F">PRODUCTION-FOCUSED AI SYSTEMS</text>

  <rect x="340" y="308" width="600" height="1" fill="url(#fadeLine)"/>
</svg>
