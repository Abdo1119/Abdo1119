<svg xmlns="http://www.w3.org/2000/svg" width="470" height="212" viewBox="0 0 470 212" role="img" aria-label="Language mix across application repositories: Python 72.3 percent, TypeScript 23.6 percent, Bicep 1.8 percent, JavaScript 1.2 percent, Shell 0.5 percent, other 0.7 percent.">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1119"/>
      <stop offset="100%" stop-color="#0E1522"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="468.5" height="210.5" rx="10" fill="url(#cardBg)" stroke="#1F2937" stroke-width="1.5"/>

  <text x="26" y="38" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.4" fill="#5FD0F5">LANGUAGE MIX</text>
  <text x="26" y="57" font-family="'Consolas','SF Mono','Roboto Mono',monospace" font-size="10.5" letter-spacing="0.7" fill="#64748B">application repositories &#183; excludes notebooks &amp; generated assets</text>

  <g>
    <rect x="26" y="76" width="260.4" height="11" rx="5.5" fill="#5FD0F5"/>
    <rect x="286.4" y="76" width="84.8" height="11" fill="#3B82F6"/>
    <rect x="371.2" y="76" width="6.3" height="11" fill="#8B5CF6"/>
    <rect x="377.5" y="76" width="4.3" height="11" fill="#E2B33C"/>
    <rect x="381.8" y="76" width="1.7" height="11" fill="#4ADE80"/>
    <rect x="383.5" y="76" width="10.5" height="11" rx="5.5" fill="#64748B"/>
  </g>

  <g font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#A9BAD4">
    <circle cx="32" cy="118" r="4.5" fill="#5FD0F5"/>
    <text x="45" y="122.5">Python</text>
    <text x="205" y="122.5" text-anchor="end" fill="#F2F6FC" font-weight="600">72.3%</text>

    <circle cx="32" cy="145" r="4.5" fill="#3B82F6"/>
    <text x="45" y="149.5">TypeScript</text>
    <text x="205" y="149.5" text-anchor="end" fill="#F2F6FC" font-weight="600">23.6%</text>

    <circle cx="32" cy="172" r="4.5" fill="#8B5CF6"/>
    <text x="45" y="176.5">Bicep</text>
    <text x="205" y="176.5" text-anchor="end" fill="#F2F6FC" font-weight="600">1.8%</text>

    <circle cx="253" cy="118" r="4.5" fill="#E2B33C"/>
    <text x="266" y="122.5">JavaScript</text>
    <text x="444" y="122.5" text-anchor="end" fill="#F2F6FC" font-weight="600">1.2%</text>

    <circle cx="253" cy="145" r="4.5" fill="#4ADE80"/>
    <text x="266" y="149.5">Shell</text>
    <text x="444" y="149.5" text-anchor="end" fill="#F2F6FC" font-weight="600">0.5%</text>

    <circle cx="253" cy="172" r="4.5" fill="#64748B"/>
    <text x="266" y="176.5">CSS &#183; Docker &#183; other</text>
    <text x="444" y="176.5" text-anchor="end" fill="#F2F6FC" font-weight="600">0.7%</text>
